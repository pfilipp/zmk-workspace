# Halcyon Ferris dongle (split central, USB powered).
# Board defaults already enable BLE, USB and +8 dBm TX power.

# Cirque touchpad on the right half is forwarded to the dongle.
CONFIG_ZMK_POINTING=y

# Custom feature from the pfilipp/zmk fork (layer-state-report branch).
CONFIG_ZMK_HID_LAYER_STATE_REPORT=y
