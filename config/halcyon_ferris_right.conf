# Halcyon Ferris right half (halcyon_wireless controller).
# Board defaults already enable sleep, BLE, USB and +8 dBm TX power.
# Kept per-side (not in a shared halcyon_ferris.conf) because ZMK also merges
# the shared file into the dongle build, where CONFIG_ZMK_SLEEP is off.

# Deep sleep after 30 min idle (board idle timeout is 15 min).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
