# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano/nrf52840/zmk
    shield: splitkb_aurora_sweep_left nice_view_adapter nice_view
    artifact-name: splitkb_aurora_sweep_left
  - board: nice_nano/nrf52840/zmk
    shield: splitkb_aurora_sweep_right nice_view_adapter nice_view
    artifact-name: splitkb_aurora_sweep_right
  - board: halcyon_dongle//zmk
    shield: halcyon_ferris_dongle mod_cirque_central
    artifact-name: halcyon_ferris_dongle
  - board: halcyon_wireless//zmk
    shield: halcyon_ferris_left mod_battery_lipo mod_display_epaper_forest
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: halcyon_ferris_left
  - board: halcyon_wireless//zmk
    shield: halcyon_ferris_right mod_battery_lipo mod_cirque_hw_right
    artifact-name: halcyon_ferris_right
  # No-dongle variant: left half is the split central and talks BLE directly
  # to the host (e.g. Vision Pro). Right half firmware is shared with dongle
  # mode; re-pair the halves when switching (settings reset / BT_CLR).
  - board: halcyon_wireless//zmk
    shield: halcyon_ferris_left mod_battery_lipo mod_display_epaper_forest mod_cirque_central
    cmake-args: -DCONFIG_ZMK_HID_LAYER_STATE_REPORT=y
    artifact-name: halcyon_ferris_left_standalone
